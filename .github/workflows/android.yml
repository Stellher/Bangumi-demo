name: Build Bangumi Glass Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          TOOL="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)"
          yes | "$TOOL" --licenses >/dev/null || true
          "$TOOL" "platforms;android-36" "build-tools;36.0.0"
      - name: Generate bundled Bangumi API catalog
        run: |
          python -m pip install --user pyyaml
          python scripts/generate_catalog.py
          test -s app/src/main/assets/bangumi_api_catalog.json
      - name: Run automated regression tests
        run: gradle --no-daemon :app:testReleaseUnitTest
      - name: Build optimized APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify APK signature and shrinker
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/mapping/release/mapping.txt
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bangumi-glass-debug-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7
